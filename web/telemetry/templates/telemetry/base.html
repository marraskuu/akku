{% load static %}
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Akku{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'telemetry/app.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'devices' %}">Akku</a>
    <span class="host">hiekkalaatikko</span>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Kirjaudu ulos</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
